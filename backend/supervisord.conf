; Runs as a normal user on a read-only root filesystem: logs go to the container's output,
; the pid file to /tmp.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:kedro-fast-api]
directory=/app
command=uvicorn app:app --host 0.0.0.0 --port 8000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:schedule]
directory=/app
command=python myschedule.py
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
