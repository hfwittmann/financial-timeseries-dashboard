---
# Builds the backend and frontend images, smoke-tests them the way the server runs them, and on main
# pushes them to GHCR as public packages. The server pulls them by digest and never builds
# (server-infra ADR-0003). No secret enters an image or its build.
name: Images

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_PATH: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: backend
          load: true
          tags: smoke/backend
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: frontend
          load: true
          tags: smoke/frontend
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test
        run: scripts/smoke-test.sh smoke/backend smoke/frontend

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushes the images the smoke test ran, not a second build, so the digest on the server is
      # the one that was tested.
      - name: Push the tested images
        if: github.event_name != 'pull_request'
        run: |
          for part in backend frontend; do
            for tag in main "sha-$GITHUB_SHA"; do
              docker tag "smoke/$part" "$REGISTRY_PATH/$part:$tag"
              docker push --quiet "$REGISTRY_PATH/$part:$tag"
            done
            echo "$part: $(docker image inspect -f '{{index .RepoDigests 0}}' "$REGISTRY_PATH/$part:main")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
